services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    healthcheck:
      test: curl 127.0.0.1:9200 &>/dev/null

  kosh-rust:
    build:
      context: .
      dockerfile: Dockerfile.rust
    command: --data-host http://elasticsearch:9200
    ports: [5001:5000]
    volumes: [../kosh_data:/var/lib/kosh:ro]
    depends_on:
      elasticsearch: {condition: service_healthy}
    healthcheck:
      test: wget -qO- 127.0.0.1:5000/metrics | grep kosh_http_requests_total &>/dev/null

  prometheus:
    image: prom/prometheus:latest
    ports: [9090:9090]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      kosh-rust:
        condition: service_started

  grafana:
    image: grafana/grafana:latest
    ports: [3000:3000]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      prometheus:
        condition: service_started
