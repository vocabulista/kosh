name: Rust CI

on:
  push:
    branches:
      - kosh-rust
  pull_request:
    branches:
      - kosh-rust

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.1.1
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sSf localhost:9200/_cluster/health || exit 1"
          --health-interval 5s
          --health-retries 20
          --health-timeout 5s
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check
        working-directory: rust

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: rust

      - name: Tests
        run: cargo test --all-targets
        working-directory: rust

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . requests

      - name: Capture Python parity artefacts
        run: |
          python scripts/capture_service_artifacts.py \
            --output-dir parity/python \
            --base-url http://127.0.0.1:6100 \
            --elastic-url http://127.0.0.1:9200 \
            --indices kosh[demo] kosh[demo_alt] \
            -- kosh \
              --data-root fixtures/demo \
              --data-host http://127.0.0.1:9200 \
              --data-sync 0 \
              --api-port 6100 \
              --log-level INFO

      - name: Capture Rust parity artefacts
        run: |
          python scripts/capture_service_artifacts.py \
            --output-dir parity/rust \
            --base-url http://127.0.0.1:6101 \
            --elastic-url http://127.0.0.1:9200 \
            --indices kosh[demo] kosh[demo_alt] \
            -- cargo run --quiet --manifest-path rust/Cargo.toml --package kosh-cli -- \
              --data-root ../fixtures/demo \
              --data-host http://127.0.0.1:9200 \
              --data-sync 0 \
              --api-port 6101 \
              --log-level INFO

      - name: Diff parity artefacts
        run: diff -ru parity/python parity/rust
