# Alert rules for the Rust Kosh deployment. Import into Prometheus/Alertmanager
# (recording rules can be added to an existing rule file or managed by your IaC tooling).

groups:
  - name: kosh-rust.alerts
    rules:
      - alert: KoshRebuildRetryStorm
        expr: increase(kosh_rebuild_retries_total[15m]) > 5
        for: 5m
        labels:
          severity: warning
          service: kosh-rust
        annotations:
          summary: "Kosh rebuild retries exceeding threshold"
          description: >
            {{ $labels.lexicon }} has recorded {{ $value }} rebuild retries in the last 15 minutes
            (phase={{ $labels.phase }}, reason={{ $labels.reason }}). Investigate Elasticsearch health,
            data quality, or watcher configuration before the circuit breaker trips.

      - alert: KoshQuarantineStuck
        expr: kosh_rebuild_quarantine_active == 1
        for: 15m
        labels:
          severity: critical
          service: kosh-rust
        annotations:
          summary: "Kosh lexicon quarantined for over 15 minutes"
          description: >
            Lexicon {{ $labels.lexicon }} has been in quarantine for more than 15 minutes.
            Check watcher logs for persistent failures or empty datasets.

      - alert: KoshSlowRebuilds
        expr: histogram_quantile(0.95, rate(kosh_rebuild_latency_seconds_bucket[10m])) > 30
        for: 10m
        labels:
          severity: warning
          service: kosh-rust
        annotations:
          summary: "Kosh rebuild latency p95 above 30 seconds"
          description: >
            The 95th percentile rebuild latency is {{ $value | printf \"%.2f\" }}s, exceeding the 30s SLO.
            Check Elasticsearch performance and lexicon size to avoid falling behind on updates.

      - alert: KoshMetricsMissing
        expr: absent(kosh_http_requests_total)
        for: 5m
        labels:
          severity: critical
          service: kosh-rust
        annotations:
          summary: "Kosh metrics endpoint is not scraping"
          description: >
            Prometheus has not scraped kosh_http_requests_total for 5 minutes. Verify the /metrics endpoint,
            service availability, or Prometheus scrape configuration.
