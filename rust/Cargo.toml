[workspace]
members = [
    "kosh-core",
    "kosh-api",
    "kosh-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["Kosh Team <info-kosh@uni-koeln.de>"]
license = "MIT"
repository = "https://github.com/cceh/kosh"
description = "Rust reimplementation of the Kosh lexical data service"
readme = "../README.md"

[workspace.dependencies]
anyhow = "1"
async-graphql = { version = "6", features = ["dynamic-schema"] }
axum = "0.7"
clap = { version = "4", features = ["derive"] }
configparser = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
notify = "6"
walkdir = "2"
sxd-document = "0.3"
sxd-xpath = "0.4"
sha1 = "0.10"
unicode-normalization = "0.1"
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "rustls-tls"] }
chrono = { version = "0.4", features = ["std", "serde"] }
serde_urlencoded = "0.7"
