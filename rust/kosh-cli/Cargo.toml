[package]
name = "kosh-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Command line entry point for the Rust-based Kosh service"

[dependencies]
clap = { workspace = true }
kosh-api = { path = "../kosh-api" }
kosh-core = { path = "../kosh-core" }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
notify = { workspace = true }
num_cpus = "1"
clap_mangen = "0.2"

[dev-dependencies]
tempfile = "3"
httpmock = "0.7"
